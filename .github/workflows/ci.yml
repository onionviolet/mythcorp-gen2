# Lint, text policy, build and types gate every push to main and every pull
# request; the Playwright suite also runs here, for information only. The repo is public, so standard GitHub-hosted
# runners cost nothing. This workflow never deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Informational: the runners have no GPU and two cores, so the WebGL
      # scenes draw a few frames a second and animation-timed specs fail at
      # random. The suite is the local pre-ship gate on real Chrome
      # (PLAYWRIGHT_SERVER=start PLAYWRIGHT_CHANNEL=chrome npm run test:smoke).
      - id: e2e
        run: npm run test:smoke
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: steps.e2e.outcome == 'failure'
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
